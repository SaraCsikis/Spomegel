<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Spomegel</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- MQTT für Matchmaking, Textnachrichten und WebRTC-Signaling -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- BILDSCHIRM 1: Lobby / Einstellungen -->
  <div id="lobbyScreen">
    <h3>Gespräch starten</h3>

    <p>
      <label>Modus:</label><br>
      <label><input type="radio" name="mode" value="video" checked> Video</label> &nbsp;
      <label><input type="radio" name="mode" value="text"> Nur Text</label>
    </p>

    <p>
      <label for="nativeLang">Ich spreche:</label><br>
      <select id="nativeLang">
        <option value="de" selected>Deutsch</option>
        <option value="en">Englisch</option>
        <option value="fr">Französisch</option>
        <option value="es">Spanisch</option>
        <option value="it">Italienisch</option>
      </select>
    </p>

    <p>
      <label for="targetLang">Ich möchte lernen:</label><br>
      <select id="targetLang">
        <option value="fr" selected>Französisch</option>
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
        <option value="es">Spanisch</option>
        <option value="it">Italienisch</option>
      </select>
    </p>

    <p>
      <label for="levelSelect">Mein Sprachniveau:</label><br>
      <select id="levelSelect">
        <option value="A1">A1 (Anfänger)</option>
        <option value="A2">A2 (Grundlegend)</option>
        <option value="B1" selected>B1 (Mittelstufe)</option>
        <option value="B2">B2 (Gute Mittelstufe)</option>
        <option value="C1">C1 (Fortgeschritten)</option>
        <option value="C2">C2 (Fließend)</option>
      </select>
    </p>

    <p>
      <label for="motivationSelect">Motivation:</label><br>
      <select id="motivationSelect">
        <option value="casual">Locker (Zum Spaß)</option>
        <option value="regular" selected>Regelmäßig (Schule / Reise)</option>
        <option value="intensive">Intensiv (Fließend / Beruf)</option>
      </select>
    </p>

    <p>
      <button id="startBtn">Partner suchen</button>
    </p>
  </div>

  <!-- BILDSCHIRM 2: Wartemodus -->
  <div id="searchOverlay" class="hidden">
    <h3>Suche nach einem Gesprächspartner...</h3>
    <p id="searchStatusText">Warte auf passenden Partner im Netzwerk...</p>
    <button id="cancelSearchBtn">Abbrechen</button>
  </div>

  <!-- BILDSCHIRM 3: Raum -->
  <div id="callRoom" class="hidden">
    <p id="practiceBanner">Du übst: Französisch (B1)</p>

    <!-- Video-Bereich (wird im Nur-Text-Modus ausgeblendet) -->
    <div id="videoSection">
      <p>
        <strong>Fremder:</strong><br>
        <video id="remoteVideo" autoplay playsinline></video>
      </p>

      <p>
        <strong>Du:</strong><br>
        <video id="localVideo" autoplay playsinline muted></video>
      </p>
    </div>

    <div id="chatMessages" class="chat-box"></div>

    <p>
      <input type="text" id="chatInput" placeholder="Nachricht schreiben..." size="45">
      <button id="chatSendBtn">Senden</button>
    </p>

    <p>
      <button id="skipBtn">Nächster Fremder (Esc)</button>
      <button id="leaveBtn">Trennen</button>
    </p>

    <hr>

    <h4>Frage zum Reden</h4>
    <p><strong>Frage:</strong> <span id="currentQuestionText">Lädt...</span></p>
    <button id="nextQuestionBtn">Nächste Frage</button>

    <h4 style="margin-top: 10px;">Wortschatz-Hilfe</h4>
    <ul id="vocabCardsContainer"></ul>
    <button id="nextVocabBtn">Mehr Wörter</button>

    <h4 style="margin-top: 10px;">Notizen</h4>
    <textarea id="notesTextarea" rows="5" cols="55" placeholder="Notizen hier eintragen..."></textarea><br>
    <span id="notesSaveStatus" style="font-size: 12px; color: gray;">Gespeichert</span> | 
    <button id="notesCopyBtn">Kopieren</button>
    <button id="notesDownloadBtn">Als .txt speichern</button>
    <button id="notesClearBtn">Löschen</button>
  </div>

  <script src="js/prompts.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
