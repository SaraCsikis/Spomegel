<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spomegel</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
</head>
<body>

  <p><strong>Timer:</strong> <span id="timerDisplay" class="timer">10:00</span></p>
  <hr>

  <!-- SCREEN 1: Setup / Lobby -->
  <div id="lobbyScreen">
    <h3>Start a Conversation</h3>

    <p>
      <label for="nativeLang">I speak:</label><br>
      <select id="nativeLang">
        <option value="de" selected>German</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="it">Italian</option>
      </select>
    </p>

    <p>
      <label for="targetLang">I want to learn:</label><br>
      <select id="targetLang">
        <option value="fr" selected>French</option>
        <option value="de">German</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="it">Italian</option>
      </select>
    </p>

    <p>
      <label for="levelSelect">My level:</label><br>
      <select id="levelSelect">
        <option value="A1">A1 (Beginner)</option>
        <option value="A2">A2 (Elementary)</option>
        <option value="B1" selected>B1 (Intermediate)</option>
        <option value="B2">B2 (Upper-Intermediate)</option>
        <option value="C1">C1 (Advanced)</option>
        <option value="C2">C2 (Fluent)</option>
      </select>
    </p>

    <p>
      <label for="motivationSelect">Motivation:</label><br>
      <select id="motivationSelect">
        <option value="casual">Casual</option>
        <option value="regular" selected>Regular</option>
        <option value="intensive">Intensive</option>
      </select>
    </p>

    <p>
      <label for="topicSelect">Conversation topic:</label><br>
      <select id="topicSelect">
        <option value="travel" selected>Travel & Holidays</option>
        <option value="daily">Daily Life & Habits</option>
        <option value="food">Food & Cooking</option>
        <option value="culture">Culture & Traditions</option>
        <option value="deep">Deep Questions & Philosophy</option>
      </select>
    </p>

    <p>
      <button id="startBtn">Find Stranger</button>
    </p>
  </div>

  <!-- SCREEN 2: Waiting -->
  <div id="searchOverlay" class="hidden">
    <h3>Looking for a partner...</h3>
    <p id="searchStatusText">Connecting...</p>
    <p><em>(Tip: Open another browser tab with this page and click Find Stranger to test pairing)</em></p>
    <button id="cancelSearchBtn">Cancel</button>
  </div>

  <!-- SCREEN 3: Chat Room -->
  <div id="callRoom" class="hidden">
    <p id="practiceBanner"><strong>Connected</strong></p>

    <div id="chatMessages" class="chat-box"></div>

    <p>
      <input type="text" id="chatInput" placeholder="Type message..." size="45">
      <button id="chatSendBtn">Send</button>
    </p>

    <p>
      <button id="skipBtn">Next Stranger (Esc)</button>
      <button id="leaveBtn">Disconnect</button>
    </p>

    <hr>

    <h4>Topic: <span id="currentTopicTitle"></span></h4>
    <p><strong>Prompt:</strong> <span id="currentQuestionText">Loading...</span></p>
    <button id="nextQuestionBtn">Next Question</button>

    <h4 style="margin-top: 10px;">Vocabulary Helper</h4>
    <ul id="vocabCardsContainer"></ul>
    <button id="nextVocabBtn">More Words</button>

    <h4 style="margin-top: 10px;">Notes</h4>
    <textarea id="notesTextarea" rows="5" cols="55" placeholder="Type personal notes here..."></textarea><br>
    <span id="notesSaveStatus" style="font-size: 12px; color: gray;">Saved</span> | 
    <button id="notesCopyBtn">Copy</button>
    <button id="notesDownloadBtn">Export .txt</button>
    <button id="notesClearBtn">Clear</button>
  </div>

  <script src="js/prompts.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
