<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Spomegel</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- MQTT für Matchmaking, Textchat und WebRTC-Signaling -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- BILDSCHIRM 1: Lobby / Einstellungen -->
  <div id="lobbyScreen">
    <h3 id="ui-title">Gespräch starten</h3>

    <p>
      <label id="ui-mode">Modus:</label><br>
      <label><input type="radio" name="mode" value="video" checked> <span id="ui-video">Video</span></label> &nbsp;
      <label><input type="radio" name="mode" value="text"> <span id="ui-text">Nur Text</span></label>
    </p>

    <p>
      <label id="ui-speaks" for="nativeLang">Ich spreche:</label><br>
      <select id="nativeLang">
        <option value="de" selected>Deutsch</option>
        <option value="en">Englisch</option>
        <option value="fr">Französisch</option>
        <option value="es">Spanisch</option>
        <option value="it">Italienisch</option>
      </select>
    </p>

    <p>
      <label id="ui-learns" for="targetLang">Ich möchte lernen:</label><br>
      <select id="targetLang">
        <option value="fr" selected>Französisch</option>
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
        <option value="es">Spanisch</option>
        <option value="it">Italienisch</option>
      </select>
    </p>

    <p>
      <label id="ui-level" for="levelSelect">Mein Sprachniveau:</label><br>
      <select id="levelSelect">
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1" selected>B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
        <option value="C2">C2</option>
      </select>
    </p>

    <p>
      <label id="ui-motivation" for="motivationSelect">Motivation:</label><br>
      <select id="motivationSelect">
        <option value="casual" id="ui-casual">Locker</option>
        <option value="regular" id="ui-regular" selected>Regelmäßig</option>
        <option value="intensive" id="ui-intensive">Intensiv</option>
      </select>
    </p>

    <p>
      <button id="startBtn">Partner suchen</button>
    </p>
  </div>

  <!-- BILDSCHIRM 2: Wartemodus -->
  <div id="searchOverlay" class="hidden">
    <h3 id="ui-searching">Suche nach einem Gesprächspartner...</h3>
    <button id="cancelSearchBtn">Abbrechen</button>
  </div>

  <!-- BILDSCHIRM 3: Raum -->
  <div id="callRoom" class="hidden">
    <p id="practiceBanner">Du übst: Französisch (B1)</p>

    <!-- Video-Bereich (wird im Nur-Text-Modus ausgeblendet) -->
    <div id="videoSection">
      <p>
        <strong id="ui-stranger">Fremder:</strong><br>
        <video id="remoteVideo" autoplay playsinline></video>
      </p>

      <p>
        <strong id="ui-you">Du:</strong><br>
        <video id="localVideo" autoplay playsinline muted></video>
      </p>
    </div>

    <div id="chatMessages" class="chat-box"></div>

    <p>
      <input type="text" id="chatInput" placeholder="Nachricht schreiben..." size="45">
      <button id="chatSendBtn">Senden</button>
    </p>

    <p>
      <button id="leaveBtn">Trennen</button>
    </p>

    <hr>

    <h4 id="ui-questions-heading">Fragen zum Reden</h4>
    <ul id="questionsList"></ul>

    <h4 style="margin-top: 10px;" id="ui-vocab-heading">Wortschatz-Hilfe</h4>
    <ul id="vocabCardsContainer"></ul>

    <h4 style="margin-top: 10px;" id="ui-notes-heading">Notizen</h4>
    <textarea id="notesTextarea" rows="5" cols="55" placeholder="Notizen hier eintragen..."></textarea><br>
    <span id="notesSaveStatus" style="font-size: 12px; color: gray;">Gespeichert</span>
  </div>

  <script src="js/prompts.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
